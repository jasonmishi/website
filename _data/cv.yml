cv:
  name: Jason (Mishike) Carvalho
  headline: Senior Software Engineer
  email: "jasonmishi@gmail.com"
  website: "https://jason.lk"
  location: "Wattala, Colombo, Sri Lanka"
  photo: "../assets/img/cv_pic.jpg"
  social_networks:
    - network: LinkedIn
      username: jasonmishi
    - network: GitHub
      username: jasonmishi
  sections:
    Summary:
      - "Senior Software Engineer with 6+ years of general engineering experience delivering scalable software systems across multiple domains. Experienced across the stack: from architecting AI/ML systems (LLMs, RAG, agentic workflows, vector databases) and cloud-native platforms (AWS, Kubernetes, Terraform, GitHub Actions) to crafting modern web applications (Vue.js, Django, FastAPI). Brings a data-driven, people-focused approach to driving outcomes across distributed teams. Adept at driving DevOps transformation and working across changing technical contexts. Curious about how things and people work. Adaptable and interested in varying technology engineering roles."
    Experience:
      - company: Innodata Inc. (Innodata Lanka)
        position: Senior Machine Learning Engineer
        url: "https://innodata.com/"
        start_date: 2024-07-01
        summary: >
          Leading AI solution architecture and engineering for global publishing clients.
          Driving cloud-native transformation across the organization through DevOps,
          platform engineering, and architectures spanning serverless, Kubernetes, and
          traditional EC2.
        highlights:
          - "**AI/ML Delivery:** Designed and deployed multilingual, multi-region NLP solutions using LLMs with RAG and agentic workflows for major publishers."
          - "**AI Research Data:** Contributed to cutting-edge long-horizon computer-use agent dataset work (reinforcement learning gym) for a global frontier AI lab, part of a $40M realized revenue program."
          - "**AI Research Data:** Worked on long-horizon SWE-bench-style dataset projects for global AI and cloud technology leaders."
          - "**AI/ML Delivery:** Architected an AWS SaaS platform forecast to generate $1M+ annual revenue, with full HA/DR strategy."
          - "**DevOps Transformation:** Introduced CI/CD with zero-downtime deployments, SonarQube, and Infrastructure as Code across engineering teams."
          - "**DevOps Transformation:** Architected the company's first Kubernetes-native application, combining K8s with GitOps (ArgoCD, Argo Rollouts, Istio) for vendor-neutral scalability."
          - "**Leadership:** Mentored a multinational squad of engineers and drove AI adoption across the development lifecycle."
      - company: 20C / FullCtl
        position: Software Engineer
        url: "https://20c.com/"
        start_date: 2022-02-01
        end_date: 2024-07-01
        summary: Developed full-stack network automation tools at open-source-first company specializing in network security. Built and maintained FullCtl peering management and network automation tools. Contributed to maintaining PeeringDB open source project. Led frontend development initially with legacy vanilla JS library and then later migration effort to Vue.js. Did backend work with Python and Django.
        highlights:
          - Introduced the use of Vue.js instead of an in-house vanilla JS framework.
          - Took over and maintained a project for an internet exchange standards organization when there was no experience within the company for the technology stack used.
          - Open source contributions to PeeringDB.
          - Overhaul of UI for FullCtl.
          - Developed and helped deploy many documentation and client websites using fully automated CI/CD.
      - company: Innodata Inc. (Innodata Lanka)
        position: Software Engineer
        url: "https://innodata.com/"
        start_date: 2020-04-01
        end_date: 2022-02-01
        summary: Was hired in some of the company's first outsourcing software development projects. Initially in a data engineering/web scraping project and then assigned as the lead frontend engineer to develop a WYSIWYG custom XML editor for one of the largest standards organizations. This product has become a key part of the company's product line.
        highlights:
          - Developed and designed a custom WYSIWYG XML web editor with custom formats and plugins for a large standards organization.
          - Developed and maintained web scraping and data-engineering scripts including OCR.
          - POC for a serverless containerized web scraping solution using AWS Lambda and Docker.
    Volunteer:
