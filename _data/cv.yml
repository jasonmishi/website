        start_date: 2023-06-01
        summary: "Served on the executive committee at IIT Toastmasters (2023–2024), helping members develop public speaking and leadership skills. Now an active member at Wattala Toastmasters, continuing to develop my own skills while mentoring others."
        highlights:
